  :root {
    --plum: #1d0f33;
    --violet: #3b1d63;
    --pumpkin: #ff7a18;
    --pumpkin-deep: #b84f00;
    --pumpkin-ink: #b34700;
    --moon: #ffc46b;
    --ghost: #fbf8ff;
    --night: #0e0718;
    --stone: #6f6790;
    --stone-dark: #4a4366;
    --display: "Chewy", "Comic Sans MS", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: var(--night); }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ghost);
    text-align: center;
    overflow-x: hidden;
  }
  .wrap { max-width: 440px; margin: 0 auto; padding: 0 16px; }

  /* ---------- Sky ---------- */
  .sky { background: linear-gradient(var(--plum), var(--violet) 85%); padding-top: 12px; }
  .scene { position: relative; height: 240px; overflow: hidden; }
  .moon {
    position: absolute; left: 4px; top: 22px; width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, #ffe2a8, var(--moon) 55%, #ff9f43);
    box-shadow: 0 0 70px 10px rgba(255, 150, 60, .35);
  }
  .bat { position: absolute; width: 46px; color: var(--night); animation: fly 9s linear infinite; }
  .bat svg { display: block; width: 100%; animation: flap .28s ease-in-out infinite alternate; }
  .bat.b1 { top: 40px; }
  .bat.b2 { top: 110px; width: 34px; animation-duration: 12s; animation-delay: -4s; }
  .bat.b3 { top: 70px; width: 26px; animation-duration: 15s; animation-delay: -10s; }
  @keyframes fly {
    0%   { transform: translate(-60px, 0); }
    30%  { transform: translate(120px, -18px); }
    60%  { transform: translate(260px, 10px); }
    100% { transform: translate(480px, -8px); }
  }
  @keyframes flap { to { transform: scaleY(.45); } }

  .ghost-btn {
    position: absolute; left: 14px; top: 60px; width: 132px;
    background: none; border: 0; padding: 0; cursor: pointer;
    animation: float 3.4s ease-in-out infinite;
    -webkit-tap-highlight-color: transparent;
  }
  .ghost-btn svg { display: block; width: 100%; filter: drop-shadow(0 12px 16px rgba(14, 7, 24, .45)); }
  .ghost-btn.wiggle svg { animation: wiggle .5s ease-in-out; }
  @keyframes float { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-14px) rotate(3deg); } }
  @keyframes wiggle { 25% { transform: rotate(-12deg) scale(1.08); } 75% { transform: rotate(12deg) scale(1.08); } }

  .bubble {
    position: absolute; left: 160px; right: 0; top: 34px;
    background: var(--ghost); color: var(--plum);
    border-radius: 22px; padding: 14px 16px;
    font-size: 16px; line-height: 1.35; text-align: left;
    box-shadow: 0 8px 0 rgba(14, 7, 24, .35);
  }
  .bubble::before {
    content: ""; position: absolute; left: -14px; top: 36px;
    border: 9px solid transparent; border-right: 14px solid var(--ghost); border-left: 0;
  }
  .bubble .punch { display: block; margin-top: 6px; font-weight: 800; color: var(--pumpkin-ink); }
  .bubble.pop { animation: pop .3s ease-out; }

  .sound {
    position: absolute; right: 0; top: 0; width: 44px; height: 44px; border-radius: 50%;
    border: 2px solid rgba(251, 248, 255, .35); background: rgba(14, 7, 24, .35);
    font-size: 20px; cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .sound[aria-pressed="true"] { border-color: var(--pumpkin); background: rgba(255, 122, 24, .25); }

  h1 {
    font-family: var(--display); font-weight: 400;
    font-size: clamp(40px, 12vw, 54px); line-height: 1; letter-spacing: .5px;
    margin: 4px 0 14px; color: var(--ghost);
    text-shadow: 3px 4px 0 var(--pumpkin);
  }
  .sub { font-size: 18px; line-height: 1.4; margin: 0 0 22px; opacity: .9; }

  .btn {
    font-family: var(--display); font-size: 24px; letter-spacing: .5px;
    width: 100%; min-height: 56px; padding: 10px 20px; border: 0; border-radius: 999px;
    background: var(--pumpkin); color: var(--night); cursor: pointer;
    box-shadow: 0 5px 0 var(--pumpkin-deep);
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--pumpkin-deep); }
  .btn.quiet { background: var(--ghost); box-shadow: 0 5px 0 #b9b2cc; font-size: 21px; }
  .btn.quiet:active { box-shadow: 0 1px 0 #b9b2cc; }
  button:focus-visible { outline: 3px solid var(--moon); outline-offset: 4px; }

  .hill { display: block; width: 100%; height: 70px; margin: 30px 0 -1px; }

  /* ---------- Graveyard ---------- */
  .ground { background: var(--night); padding-bottom: 36px; }
  h2 { font-family: var(--display); font-weight: 400; font-size: 34px; margin: 0 0 4px; color: var(--moon); }
  .hint { margin: 0 0 22px; opacity: .8; font-size: 16px; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 14px; max-width: 300px; margin: 0 auto 16px; }
  .stone {
    aspect-ratio: 4 / 5; border: 0; cursor: pointer;
    font: 800 30px system-ui, sans-serif; color: #d6d1e8;
    background: linear-gradient(var(--stone), var(--stone-dark));
    border-radius: 50% 50% 8px 8px / 42% 42% 8px 8px;
    box-shadow: inset 0 -7px 0 rgba(14, 7, 24, .25), 0 7px 0 #2a1d3f;
    -webkit-tap-highlight-color: transparent;
  }
  .stone:nth-child(3n + 1) { transform: rotate(-4deg); }
  .stone:nth-child(3n) { transform: rotate(3deg); }
  .stone:nth-child(5) { transform: rotate(-2deg) translateY(4px); }
  .stone:disabled { cursor: default; background: linear-gradient(#2d2245, #221935); box-shadow: 0 7px 0 #1a1229; }
  .stone.found { background: radial-gradient(circle, rgba(255, 122, 24, .7), #2d2245 72%); animation: pop .4s; }
  @keyframes pop { 50% { scale: 1.12; } }

  .status { min-height: 1.5em; margin: 0 0 14px; font-size: 18px; font-weight: 700; }
  .share { margin-top: 30px; }
  #shareStatus { margin-top: 12px; }

  footer { font-family: var(--display); font-size: 28px; color: var(--moon); margin-top: 26px; }
  footer .sig { display: block; font-size: 22px; color: var(--ghost); opacity: .8; margin-top: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .bat.b1 { left: 120px; } .bat.b2 { left: 30px; } .bat.b3 { left: 90px; top: 160px; }
  }
</style>

          <ellipse cx="50" cy="66" rx="9" ry="12" fill="#1d0f33"/>
          <ellipse cx="90" cy="66" rx="9" ry="12" fill="#1d0f33"/>
          <circle cx="53" cy="61" r="3.5" fill="#fff"/>
          <circle cx="93" cy="61" r="3.5" fill="#fff"/>
          <ellipse cx="36" cy="86" rx="9" ry="5" fill="#ffb3c7"/>
          <ellipse cx="104" cy="86" rx="9" ry="5" fill="#ffb3c7"/>
          <path d="M56 88q14 18 28 0" fill="#1d0f33"/>
          <path d="M64 94q6 6 12 0q-2 6-6 6t-6-6z" fill="#ff7a9a"/>
        </svg>
      </button>
      <p class="bubble" id="bubble" aria-live="polite">Psst! Want to hear a joke? Tap the orange button.</p>
      <button class="sound" id="soundBtn" type="button" aria-pressed="false" aria-label="Spooky sound">🔇</button>
    </div>

    <h1>Boo!<br>You've been ghosted! 👻</h1>
    <p class="sub">Don't worry, I'm still here. Happy Halloween!</p>
    <button class="btn" id="jokeBtn" type="button">Tell me a spooky joke</button>
  </div>
  <svg class="hill" viewBox="0 0 400 70" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 70V44C40 30 80 22 130 30s90 26 140 18 90-34 130-26v44z" fill="#0e0718"/>
  </svg>
</section>

<section class="ground">
  <div class="wrap">
    <h2>Pumpkin Hunt</h2>
    <p class="hint">One gravestone hides a pumpkin. Tap to look behind them.</p>
    <div class="grid" id="grid"></div>
    <p class="status" id="status" aria-live="polite"></p>
    <button class="btn quiet" id="againBtn" type="button" hidden>Play again</button>

    <button class="btn share" id="shareBtn" type="button">📤 Ghost a friend</button>
    <p class="status" id="shareStatus" aria-live="polite"></p>

    <footer>Trick or treat! 🎃<span class="sig">— Viktor</span></footer>
  </div>
</section>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const URL_TO_SHARE = 'https://youhavebeenghosted.com';
  const bubble = $('bubble');

  const say = (text, punch) => {
    bubble.textContent = text;
    if (punch) {
      const p = document.createElement('span');
      p.className = 'punch';
      p.textContent = punch;
      bubble.appendChild(p);
    }
    bubble.classList.remove('pop'); void bubble.offsetWidth; bubble.classList.add('pop');
  };

  // --- Spooky Jokes: shuffled deck, no repeats until all have been shown ---
  const JOKES = [
    ["Why didn't the skeleton go to the party?", "He had no body to go with."],
    ["What do ghosts put on their cereal?", "Boo-berries!"],
    ["Why are ghosts terrible at lying?", "You can see right through them."],
    ["What's a ghost's favorite dessert?", "I scream!"],
    ["Which room does a ghost never need?", "The living room."],
    ["What do you call a witch at the beach?", "A sand-witch."],
    ["How do pumpkins stay in shape?", "They do squash."],
    ["Why don't mummies take vacations?", "They're scared they'll relax and unwind."],
    ["What's a ghost's favorite theme park ride?", "The roller-ghoster."],
    ["What do you call a ghost's mistake?", "A boo-boo."],
    ["What do skeletons say before dinner?", "Bone appétit!"],
    ["What do you call a pumpkin that guards the pool?", "A life-gourd."],
    ["Where do ghosts mail their letters?", "At the ghost office."],
    ["What do bats do for fun?", "They just hang out."],
    ["Why did the cyclops close his school?", "He only had one pupil."],
    ["What kind of music do mummies love?", "Wrap music."],
    ["What do you get if you cross a vampire with a snowman?", "Frostbite."],
    ["Why do ghosts love elevators?", "They lift their spirits."],
    ["How do you fix a cracked jack-o'-lantern?", "With a pumpkin patch."],
    ["What's a ghost's favorite game?", "Hide and shriek."],
    ["What did one ghost say to the other?", "\"Do you believe in people?\""],
  ];
  let deck = [];
  let current = null;
  const nextJoke = () => {
    if (!deck.length) deck = JOKES.map((_, i) => i).sort(() => Math.random() - .5);
    return JOKES[deck.pop()];
  };
  $('jokeBtn').addEventListener('click', () => {
    current = nextJoke();
    say(...current);
  });

  // --- Spooky Sound: synthesized wail, only after the visitor opts in ---
  let audio = null;
  let soundOn = false;
  const wail = () => {
    if (!soundOn || !audio) return;
    const t = audio.currentTime;
    const osc = audio.createOscillator();
    const lfo = audio.createOscillator();
    const lfoGain = audio.createGain();
    const gain = audio.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(320, t);
    osc.frequency.exponentialRampToValueAtTime(620, t + .7);
    osc.frequency.exponentialRampToValueAtTime(360, t + 1.8);
    lfo.frequency.value = 6;
    lfoGain.gain.value = 18;
    lfo.connect(lfoGain).connect(osc.frequency);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(.18, t + .25);
    gain.gain.linearRampToValueAtTime(0, t + 1.9);
    osc.connect(gain).connect(audio.destination);
    osc.start(t); lfo.start(t);
    osc.stop(t + 2); lfo.stop(t + 2);
  };
  $('soundBtn').addEventListener('click', () => {
    const btn = $('soundBtn');
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) { say('Sorry, this phone keeps me quiet.'); return; }
    if (!audio) audio = new Ctx();
    audio.resume();
    soundOn = !soundOn;
    btn.setAttribute('aria-pressed', String(soundOn));
    btn.textContent = soundOn ? '🔊' : '🔇';
    if (soundOn) { say('wooOOOooo! 🎶'); wail(); } else { say('Shh… quiet ghost mode.'); }
  });

  // --- Ghost poke: a quick reaction, then back to whatever it was saying ---
  const POKES = ['Boo!', 'Hehe, that tickles!', 'Eek!', 'Wooo!', 'Hey, I was floating!'];
  let pokeTimer;
  $('ghost').addEventListener('click', () => {
    const g = $('ghost');
    g.classList.remove('wiggle'); void g.offsetWidth; g.classList.add('wiggle');
    say(POKES[Math.floor(Math.random() * POKES.length)]);
    wail();
    clearTimeout(pokeTimer);
    pokeTimer = setTimeout(() => current
      ? say(...current)
      : say('Psst! Want to hear a joke? Tap the orange button.'), 1600);
  });

  // --- Pumpkin Hunt ---
  const MISSES = ['👻', '🕸️', '🦇', '🍬', '🕷️', '🧦'];
  let pumpkinAt, taps;
  const newRound = () => {
    pumpkinAt = Math.floor(Math.random() * 9);
    taps = 0;
    $('status').textContent = '';
    $('againBtn').hidden = true;
    const grid = $('grid');
    grid.replaceChildren();
    for (let i = 0; i < 9; i++) {
      const s = document.createElement('button');
      s.type = 'button';
      s.className = 'stone';
      s.textContent = '?';
      s.setAttribute('aria-label', `Gravestone ${i + 1}`);
      s.addEventListener('click', () => peek(s, i));
      grid.appendChild(s);
    }
  };
  const peek = (stone, i) => {
    taps++;
    stone.disabled = true;
    if (i === pumpkinAt) {
      stone.textContent = '🎃';
      stone.classList.add('found');
      stone.setAttribute('aria-label', 'Pumpkin!');
      $('grid').querySelectorAll('.stone').forEach(s => { s.disabled = true; });
      $('status').textContent = taps === 1 ? 'WOW! First try! 🎉' : `Found it in ${taps} taps! 🎉`;
      $('againBtn').hidden = false;
      wail();
    } else {
      stone.textContent = MISSES[Math.floor(Math.random() * MISSES.length)];
      stone.setAttribute('aria-label', 'Not here');
      $('status').textContent = 'Boo! Not here!';
    }
  };
  $('againBtn').addEventListener('click', newRound);
  newRound();

  // --- Share: native share sheet, else copy the link ---
  $('shareBtn').addEventListener('click', async () => {
    const msg = $('shareStatus');
    const text = 'I just got ghosted 👻 Tap if you dare:';
    if (navigator.share) {
      try { await navigator.share({ title: "You've been ghosted!", text, url: URL_TO_SHARE }); return; }
      catch (e) { if (e.name === 'AbortError') return; }
    }
    try {
      await navigator.clipboard.writeText(`${text} ${URL_TO_SHARE}`);
      msg.textContent = 'Link copied! Go ghost a friend 👻';
    } catch {
      msg.textContent = `Share this: ${URL_TO_SHARE}`;
    }
  });
})();
</script>
</body>
</html>
