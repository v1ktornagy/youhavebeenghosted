  @page { size: letter portrait; margin: 0.4in; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: #000; }
  body { font-family: "Chewy", "Comic Sans MS", system-ui, sans-serif; text-align: center; }
  .sheet {
    width: 7.7in; height: 10.1in; margin: 0 auto; padding: 0.35in 0.4in;

    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.1in;
  }
  h1 { margin: 0; font-weight: 400; font-size: 50pt; line-height: 1; }
  h1 small { display: block; font-size: 30pt; margin-top: 0.08in; }
  .code { position: relative; width: 6.3in; height: 6.3in; padding: 0.3in; border: 6px solid #000; border-radius: 0.35in; }
  .qr { display: block; width: 100%; height: 100%; }
  .ghost { position: absolute; width: 1.15in; right: -0.7in; top: -1.15in; transform: rotate(14deg); }
  .boo { position: absolute; left: -0.55in; bottom: -0.45in; transform: rotate(-12deg); font-size: 34pt; background: #fff; padding: 0 0.1in; }
  @media screen {
    body { background: #e9e5f2; padding: 24px 0; }
    .sheet { background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,.15); }
    .tip { font: 15px system-ui, sans-serif; margin: 0 0 16px; color: #333; }
  }
  @media print { .tip { display: none; } }
</style>
